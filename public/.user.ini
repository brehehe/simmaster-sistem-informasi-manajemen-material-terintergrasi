; Security Hardening .user.ini
; Mitigation for CVE-2026-109618: Administratively disable session upload progress
session.upload_progress.enabled = 0

; Information disclosure mitigation
display_errors = 0
display_startup_errors = 0
log_errors = 1

; Resource abuse mitigations
max_execution_time = 60
memory_limit = 512M
post_max_size = 64M
upload_max_filesize = 32M
